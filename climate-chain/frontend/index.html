<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Climate Chain: one guided path from climate signal to verification, action, finance and proof, 18 project modules (bundled fixtures; 4 live feeds)." />
    <meta name="theme-color" content="#070b16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Climate Chain — from signal to proof</title>
  </head>
  <body>
    <script>
      // Apply the persisted or preferred color scheme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('climate-chain-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (error) { /* storage unavailable: default light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
